{% extends "base.html" %}
{% load static %}

{% block style %}
<link rel="stylesheet" href="{% static 'css/sign.css' %}">
{% endblock style %}

{% block content %}

<div class="container">
    <form method="post">
        {% csrf_token %}
        <div id="img">
            <img src="{{ url }}" alt="">
        </div>

        <div id="fields">
            <h2>Signup Form</h2>
            {{ form.first_name }}
            {{ form.last_name }}
            {{ form.email }}
            {{ form.password1 }}
            {{ form.password2 }}
            <button type="submit">Signup</button>
        </div>
        
    </form>
</div>

{% endblock content %}
